<div class="header-container">
  <div class="header-left">
    <div class="header-logo">
      <h1>BFMC</h1>
      <h1>Dashboard</h1>
    </div>
    <div class="badges-container">
      <span 
        hlmBadge 
        variant="secondary"
        class="connection-badge"
      >
        <ng-icon 
          name="tablerPoint"
          class="connection-icon"
          size="25"
        />
        <span>Connected</span>
      </span>
      <span 
        hlmBadge 
        variant="secondary"
        class="simulator-badge"
      >
        Simulator
      </span>
    </div>
  </div>

  <div class="header-right">
    <ng-icon 
      name="tablerSun"
      class="theme-toggle"
      size="30"
    />

    <span class="clock">{{ currentTime() | date:'HH:mm:ss' }}</span>
  </div>
</div>
