<div class="first-row">
  <app-bento bentoTitle="Speed">
    <div echarts [options]="speedOptions" class="w-64 h-64"></div>
  </app-bento>
  <app-bento bentoTitle="Steering Angle">
    <div echarts [options]="steeringAngleOptions" class="w-64 h-64"></div>
  </app-bento>
  <app-bento bentoTitle="Throttle Pedal">
    <div echarts [options]="throttleOptions" class="w-64 h-64"></div>
  </app-bento>
  <app-bento bentoTitle="Consumed mAh">
    <div echarts [options]="consumedMahOptions" class="w-64 h-64"></div>
  </app-bento>

  <app-bento 
    bentoTitle="Driving Mode" 
    class="driving-mode ml-auto "
    className='flex flex-col w-full h-full justify-around pb-4!'
  >
    <button hlmBtn>
      <ng-icon name="tablerHourglassEmpty" size="30"></ng-icon>
      Stop
    </button>
    <button hlmBtn>
      <ng-icon name="tablerHandFinger" size="30"></ng-icon>
      Manual
    </button>
    <button hlmBtn>
      <ng-icon name="tablerOlympicTorch" size="30"></ng-icon>
      Legacy
    </button>
    <button hlmBtn>
      <ng-icon name="tablerSteeringWheel" size="30"></ng-icon>
      Auto
    </button>
  </app-bento>
</div>

<!-- Alert Modal -->
<div *ngIf="showAlert" class="alert-modal">
  <div class="alert-modal-content">
    <h2>Security Setup Required</h2>
    <p>Please set a password to secure your dashboard. The password must be set in the app.component.ts file.</p>
    <button (click)="dismissAlert()" class="close-btn">Close</button>
  </div>
</div>
<!-- Cluster -->
<div class="cluster-container">
  <app-cluster 
    class="cluster" 
    [cursorRotation]="cursorRotationSliderValue" 
    [carPosition]="carPositionSliderValue"
    [carLeftLaneOn]="carLeftLaneOn" 
    [carRightLaneOn]="carRightLaneOn"
  ></app-cluster>

  <!-- Settings gear button overlayed in top-right of cluster (offline unicode icon ⚙) -->
  <button class="settings-gear" (click)="openSettings()" aria-label="Open settings">⚙</button>

  <!-- Settings modal overlay -->
  <app-settings [open]="showSettingsModal" (close)="closeSettings()"></app-settings>
</div>

<app-table class="table" />
